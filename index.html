<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dancing Orb</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      canvas { display: block; }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        color: white;
        font-family: sans-serif;
      }
      #ui-layer > * { pointer-events: auto; }
      #file-input {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: rgba(0,0,0,0.7);
        padding: 10px;
        border-radius: 5px;
        color: white;
      }
      #start-hint {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: sans-serif;
        font-size: 24px;
        text-align: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <input type="file" id="file-input" accept="audio/*">
    <audio id="audio" controls style="display:none;"></audio>
    <div id="start-hint">Select an audio file to start dancing!</div>
    <div id="app"></div>
    <div id="ui-layer"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
